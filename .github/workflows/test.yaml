name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Verilator (OSS CAD Suite)
        shell: bash
        run: |
          # cocotb 2.x requires Verilator >= 5.036; ubuntu-24.04 apt ships an
          # older version, so use the YosysHQ OSS CAD Suite build instead.
          # Release assets are date-stamped, so resolve the URL via the API.
          URL=$(curl -sfL https://api.github.com/repos/YosysHQ/oss-cad-suite-build/releases/latest \
            | grep -oE '"browser_download_url": *"[^"]*oss-cad-suite-linux-x64-[0-9]{8}\.tgz"' \
            | head -1 | cut -d'"' -f4)
          test -n "$URL"
          wget -q "$URL" -O oss-cad-suite.tgz
          tar -xzf oss-cad-suite.tgz -C "${{ github.workspace }}"
          echo "${{ github.workspace }}/oss-cad-suite/bin" >> "$GITHUB_PATH"

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean SIM=verilator
          make SIM=verilator
          # Check the JUnit report after the simulator run completes. Match
          # only real <failure>/<error> elements: the root element always
          # carries a failures="0" attribute, which plain 'grep failure'
          # would match even on a fully passing run.
          ! grep -qE "<(failure|error)" results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        if: always() && hashFiles('test/results.xml') != ''
        with:
          paths: "test/results.xml"

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
