project:
  title:        "Programmable Protocol Emulator ASIC"
  author:       "Jane Street ASIC Competition"
  discord:      ""
  description:  "A programmable microcoded GPIO protocol engine for UART, SPI, I2C, and related serial protocols."
  language:     "SystemVerilog"
  clock_hz:     50000000
  tiles:        "6x4"
  top_module:   "tt_um_protocol_emulator"
  source_files:
    - "project.v"
    - "cfg_spi_slave.sv"
    - "host_cmd_if.sv"
    - "management_decode.sv"
    - "csr_block.sv"
    - "program_mem.sv"
    - "tx_fifo.sv"
    - "rx_fifo.sv"
    - "engine/protocol_emulator_top.sv"
    - "engine/pe_host_if.sv"
    - "engine/pe_imem.sv"
    - "engine/pe_clkdiv.sv"
    - "engine/pe_core.sv"
    - "engine/pe_decoder.sv"
    - "engine/pe_io.sv"
    - "engine/pe_fifo.sv"
    - "engine/pe_sync.sv"

pinout:
  ui[0]: "CFG_MOSI"
  ui[1]: "CFG_SCLK"
  ui[2]: "CFG_CS_N"
  ui[3]: "reserved/debug"
  ui[4]: "reserved/debug"
  ui[5]: "reserved/debug"
  ui[6]: "reserved/debug"
  ui[7]: "reserved/debug"

  uo[0]: "CFG_MISO"
  uo[1]: "STATUS/IRQ"
  uo[2]: "reserved/debug"
  uo[3]: "reserved/debug"
  uo[4]: "reserved/debug"
  uo[5]: "reserved/debug"
  uo[6]: "reserved/debug"
  uo[7]: "reserved/debug"

  uio[0]: "protocol GPIO0"
  uio[1]: "protocol GPIO1"
  uio[2]: "protocol GPIO2"
  uio[3]: "protocol GPIO3"
  uio[4]: "protocol GPIO4"
  uio[5]: "protocol GPIO5"
  uio[6]: "protocol GPIO6"
  uio[7]: "protocol GPIO7"

yaml_version: 6
